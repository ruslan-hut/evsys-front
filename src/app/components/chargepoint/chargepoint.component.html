
<mat-card class="chargepoint-card interactive-surface"
          [class.state-changed]="stateChanged()"
          [class.row-clickable]="isSingleAction()"
          [attr.role]="isSingleAction() ? 'button' : null"
          [attr.tabindex]="isSingleAction() ? 0 : null"
          (click)="onCardClick()"
          (keydown.enter)="onCardKeydown($event)"
          (keydown.space)="onCardKeydown($event)">
  <mat-card-header>
    <mat-card-title>
      <span class="status-dot"
            [class.status-green]="getStatusColor() === 'green'"
            [class.status-yellow]="getStatusColor() === 'yellow'"
            [class.status-red]="getStatusColor() === 'red'"
            [attr.aria-label]="getStatusLabel()"
            role="img">
      </span>
      {{chargepoint().title}}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div>
      {{ chargepoint().address }}
    </div>
    <div>
      {{chargepoint().description}}
    </div>
    <div class="status-line">
      <span class="status-text">{{chargepoint().status}}</span>
      <span class="status-separator">•</span>
      <span class="update-text">{{ timeService.getTimeDifference(chargepoint().event_time) }}</span>
    </div>
  </mat-card-content>
  <div class="connector-rail" role="list" [attr.aria-label]="'Connectors on ' + chargepoint().title">
    @for (connector of chargepoint().connectors | sortConnectors; track connector.connector_id) {
      <div role="listitem">
        <app-connector [connector]="connector" />
      </div>
    }
  </div>
  @if (actions().length > 1) {
    <mat-card-actions align="end" class="tool-panel">
      <app-row-actions [actions]="actions()" [forLabel]="chargepoint().title" />
    </mat-card-actions>
  }
</mat-card>
