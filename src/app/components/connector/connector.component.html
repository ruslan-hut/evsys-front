<button type="button"
        class="slot"
        [class]="getConnectorStatusClass()"
        [class.charging]="isCharging()"
        (click)="openInfo($event)"
        [disabled]="isDisabled()"
        [attr.aria-label]="ariaLabel()">
  <span class="slot-bar" aria-hidden="true"></span>

  <span class="slot-body" aria-hidden="true">
    <span class="slot-number">{{ getConnectorName() }}</span>

    <span class="slot-readings">
      <span class="slot-reading">
        <img [src]="getConnectorTypeIcon()" alt="" class="slot-icon" />
        <span class="slot-type">{{ connector().type }}</span>
      </span>
      <span class="slot-reading">
        <img src="assets/icons/bolt.svg" alt="" class="slot-icon" />
        <span class="slot-power">{{ connector().power | number:'1.0-1' }} kW</span>
      </span>
    </span>
  </span>

  <span class="slot-status" aria-hidden="true">{{ connector().status | titlecase }}</span>
</button>
